<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dheeru Scientific Calculator</title>
    <style>
        /* CSS: Professional & Scientific Design */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121212; /* Darker Background */
        }

        .brand-title {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 159, 10, 0.5);
        }

        .calculator {
            background: #252525;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            width: 400px; /* Thoda chauda kiya scientific buttons ke liye */
        }

        .display {
            width: 100%;
            height: 90px;
            background: #000;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: right;
            padding: 20px;
            font-size: 2rem;
            color: #fff;
            border: 2px solid #333;
            outline: none;
            overflow-x: auto;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5 Columns */
            gap: 10px;
        }

        button {
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Color Coding */
        .btn-num { background-color: #3a3a3a; color: #fff; }
        .btn-num:hover { background-color: #4a4a4a; }

        .btn-op { background-color: #ff9f0a; color: #fff; }
        .btn-op:hover { background-color: #ffb03b; }

        .btn-sci { background-color: #5e5ce6; color: #fff; } /* Scientific Buttons Purple */
        .btn-sci:hover { background-color: #7472ff; }

        .btn-action { background-color: #a5a5a5; color: #000; }
        .btn-action:hover { background-color: #d4d4d4; }

        .btn-equal { 
            background-color: #30d158; 
            color: #fff; 
            grid-column: span 2; 
        }
        .btn-equal:hover { background-color: #4ce072; }

        footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="brand-title">Dheeru Calculator <span style="font-size: 0.5em; vertical-align: super; color: #ff9f0a;">PRO</span></div>

    <div class="calculator">
        <input type="text" class="display" id="display" readonly placeholder="0">
        
        <div class="buttons">
            <button class="btn-sci" onclick="appendToDisplay('sin(')">sin</button>
            <button class="btn-sci" onclick="appendToDisplay('cos(')">cos</button>
            <button class="btn-sci" onclick="appendToDisplay('tan(')">tan</button>
            <button class="btn-action" onclick="clearDisplay()">C</button>
            <button class="btn-action" onclick="deleteLast()">DEL</button>

            <button class="btn-sci" onclick="appendToDisplay('log(')">log</button>
            <button class="btn-sci" onclick="appendToDisplay('√(')">√</button>
            <button class="btn-sci" onclick="appendToDisplay('^')">^</button>
            <button class="btn-sci" onclick="appendToDisplay('(')">(</button>
            <button class="btn-sci" onclick="appendToDisplay(')')">)</button>

            <button class="btn-sci" onclick="appendToDisplay('π')">π</button>
            <button class="btn-num" onclick="appendToDisplay('7')">7</button>
            <button class="btn-num" onclick="appendToDisplay('8')">8</button>
            <button class="btn-num" onclick="appendToDisplay('9')">9</button>
            <button class="btn-op" onclick="appendToDisplay('/')">÷</button>

            <button class="btn-sci" onclick="appendToDisplay('e')">e</button>
            <button class="btn-num" onclick="appendToDisplay('4')">4</button>
            <button class="btn-num" onclick="appendToDisplay('5')">5</button>
            <button class="btn-num" onclick="appendToDisplay('6')">6</button>
            <button class="btn-op" onclick="appendToDisplay('*')">×</button>

            <button class="btn-num" onclick="appendToDisplay('.')">.</button>
            <button class="btn-num" onclick="appendToDisplay('1')">1</button>
            <button class="btn-num" onclick="appendToDisplay('2')">2</button>
            <button class="btn-num" onclick="appendToDisplay('3')">3</button>
            <button class="btn-op" onclick="appendToDisplay('-')">−</button>

            <button class="btn-num" onclick="appendToDisplay('00')">00</button>
            <button class="btn-num" onclick="appendToDisplay('0')">0</button>
            <button class="btn-equal" onclick="calculateResult()">=</button>
            <button class="btn-op" onclick="appendToDisplay('+')">+</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Dheeru Calculator Pro. All rights reserved.<br>
        Designed & Powerad by Dheerendra Patel.
    </footer>

    <script>
        const display = document.getElementById('display');

        function appendToDisplay(input) {
            // Agar pichla result Error tha, to clear kar do naya type karne se pehle
            if(display.value === "Error" || display.value === "Infinity") {
                display.value = "";
            }
            display.value += input;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.toString().slice(0, -1);
        }

        function calculateResult() {
            try {
                let expression = display.value;

                // 1. Math symbols ko JavaScript samajhne layak banana
                
                // Pi (π) ko Math.PI se replace karein
                expression = expression.replace(/π/g, 'Math.PI');
                
                // e ko Math.E se replace karein
                expression = expression.replace(/e/g, 'Math.E');
                
                // Root (√) ko Math.sqrt se replace karein
                expression = expression.replace(/√/g, 'Math.sqrt');
                
                // Power (^) ko ** se replace karein
                expression = expression.replace(/\^/g, '**');

                // Log (base 10)
                expression = expression.replace(/log/g, 'Math.log10');

                // 2. Trigonometry Logic (Degrees me convert karna)
                // Computer radians use karta hai, humein ise degrees banana hai
                // Formula: sin(x) -> Math.sin(x * Math.PI / 180)
                
                expression = expression.replace(/sin\(([^)]+)\)/g, 'Math.sin($1 * Math.PI / 180)');
                expression = expression.replace(/cos\(([^)]+)\)/g, 'Math.cos($1 * Math.PI / 180)');
                expression = expression.replace(/tan\(([^)]+)\)/g, 'Math.tan($1 * Math.PI / 180)');

                // 3. Final Calculation
                let result = eval(expression);

                // Check for Infinite or NaN
                if (!isFinite(result) || isNaN(result)) {
                    display.value = "Infinity"; // Ya phir "Too Large"
                } else {
                    // Agar result mein bahut zyada decimal hain to limit karein (max 8)
                    if (Number.isInteger(result)) {
                        display.value = result;
                    } else {
                        // Precision handling
                        display.value = parseFloat(result.toFixed(8)); 
                    }
                }
            } catch (error) {
                display.value = "Error";
            }
        }

        // Keyboard Support
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            if ((key >= 0 && key <= 9) || key === '.' || key === '+' || key === '-' || key === '*' || key === '/' || key === '(' || key === ')') {
                appendToDisplay(key);
            } else if (key === 'Enter') {
                calculateResult();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape') {
                clearDisplay();
            }
        });
    </script>
</body>

</html>
